
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Arunjot 💗</title>

<style>
body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #ffd6e7, #e6d6ff);
    text-align: center;
    color: #7a2852;
}

.card {
    background: rgba(255,255,255,0.85);
    padding: 30px;
    border-radius: 25px;
    width: 80%;
    max-width: 350px;
    box-shadow: 0 10px 30px #d99aba;
}

h1 {
    color: #ff4f91;
}

.heart {
    font-size: 55px;
    animation: beat 1s infinite;
}

button {
    background: #ff5c9a;
    color: white;
    border: none;
    padding: 12px 20px;
    border-radius: 25px;
    font-size: 16px;
    cursor: pointer;
}

#message {
    display: none;
    line-height: 1.7;
    margin-top: 20px;
}

@keyframes beat {
    50% { transform: scale(1.2); }
}
</style>
</head>

<body>
<div class="card">
    <div class="heart">💗</div>

    <h1>Hey Arunjot! 🫶🏻</h1>

    <p>Ik chhoti jehi message tere layi ✨</p>

    <button onclick="showMessage()">
        Click Me 💌
    </button>

    <div id="message">
        <h3>Dear Arunjot 💕</h3>
        Tu ik changa friend aa! 🥹💗
        <br>
        Hamesha khush reh,
        <br>
        smile karda reh 😊
        <br>
        Stay blessed, bestie! 🌷
        <br><br>
        <b>From your friend 💖</b>
    </div>
</div>

<script>
function showMessage() {
    document.getElementById("message").style.display = "block";
}
</script>
</body>
</html>
